<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">Toluva — from first conviction to lasting liquidity</title>
  <desc id="desc">Dark Toluva banner with a three-stage DBC, DAMM v2, and DLMM launch path.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1027"/>
      <stop offset="0.55" stop-color="#15112f"/>
      <stop offset="1" stop-color="#24113a"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7657ff"/>
      <stop offset="0.52" stop-color="#d744b4"/>
      <stop offset="1" stop-color="#ff648b"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9b78ff"/>
      <stop offset="0.55" stop-color="#e654bc"/>
      <stop offset="1" stop-color="#5fe4db"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#c641ae" stop-opacity=".26"/>
      <stop offset="1" stop-color="#c641ae" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#fff" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#050714" flood-opacity=".5"/></filter>
  </defs>
  <rect width="1600" height="520" rx="26" fill="url(#bg)"/>
  <rect width="1600" height="520" rx="26" fill="url(#grid)"/>
  <circle cx="1180" cy="260" r="360" fill="url(#glow)"/>
  <circle cx="1540" cy="-80" r="260" fill="#7952f2" fill-opacity=".08" filter="url(#blur)"/>
  <path d="M0 437C252 356 373 557 624 481S1006 355 1294 456 1530 419 1600 365" fill="none" stroke="#c75bd0" stroke-opacity=".10" stroke-width="46"/>
  <path d="M-20 112C268 188 381 23 634 99S1007 225 1272 95 1528 92 1630 172" fill="none" stroke="#8370ea" stroke-opacity=".10" stroke-width="30"/>

  <g transform="translate(72 68)">
    <rect x="0" y="0" width="69" height="69" rx="20" fill="url(#pink)"/>
    <path d="M25 46V26c0-10 19-10 19 0v20M20 45h30M23 27l-5-7M46 27l5-7" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="34.5" cy="45" r="5" fill="#fff"/>
    <text x="92" y="53" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="51" font-weight="800" letter-spacing="-2">Toluva</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="72" y="219" fill="#f8f8ff" font-size="55" font-weight="800" letter-spacing="-2.5">Launch with conviction.</text>
    <text x="72" y="284" fill="#f8f8ff" font-size="55" font-weight="800" letter-spacing="-2.5">Build what comes after.</text>
    <text x="74" y="341" fill="#c4c0d8" font-size="22" letter-spacing=".2">A wallet-signed token journey across Meteora’s liquidity stack.</text>
    <rect x="72" y="385" width="198" height="44" rx="22" fill="#f349a8" fill-opacity=".14" stroke="#f349a8" stroke-opacity=".42"/>
    <circle cx="93" cy="407" r="5" fill="#ff5cab"/>
    <text x="108" y="414" fill="#ffc4e5" font-size="17" font-weight="700" letter-spacing="1.2">LIVE ON DEVNET</text>
  </g>

  <g transform="translate(826 96)" filter="url(#shadow)" font-family="Arial, Helvetica, sans-serif">
    <path d="M100 183H587" stroke="url(#path)" stroke-width="5" stroke-linecap="round"/>
    <path d="M574 175l16 8-16 8" fill="none" stroke="#65e8df" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <g>
      <rect x="0" y="73" width="205" height="218" rx="24" fill="#1e1c41" stroke="#8c72f8" stroke-opacity=".8" stroke-width="2"/>
      <rect x="18" y="91" width="61" height="61" rx="18" fill="#8465ea" fill-opacity=".2"/>
      <path d="M35 136c10-19 17-19 27 0M35 136h28" fill="none" stroke="#bbabff" stroke-width="3" stroke-linecap="round"/>
      <text x="18" y="190" fill="#e6defe" font-size="15" font-weight="700" letter-spacing="2">01 / DISCOVER</text>
      <text x="18" y="225" fill="#ffffff" font-size="28" font-weight="800">DBC</text>
      <text x="18" y="254" fill="#b4b0cc" font-size="16">Launch + curve</text>
    </g>
    <g>
      <rect x="228" y="31" width="205" height="260" rx="24" fill="#242044" stroke="#db58be" stroke-opacity=".8" stroke-width="2"/>
      <rect x="246" y="49" width="61" height="61" rx="18" fill="#df5cba" fill-opacity=".17"/>
      <path d="M262 93l15-25 15 25h-30z" fill="none" stroke="#ff98d7" stroke-width="3" stroke-linejoin="round"/>
      <text x="246" y="149" fill="#ffd7ee" font-size="15" font-weight="700" letter-spacing="2">02 / GRADUATE</text>
      <text x="246" y="185" fill="#ffffff" font-size="28" font-weight="800">DAMM v2</text>
      <text x="246" y="215" fill="#c5bfd2" font-size="16">Migrated liquidity</text>
      <path d="M246 245H414" stroke="#dc5aba" stroke-opacity=".35"/>
      <text x="246" y="271" fill="#ffc1e6" font-size="15" font-weight="700">50% creator lock*</text>
    </g>
    <g>
      <rect x="456" y="73" width="205" height="218" rx="24" fill="#1b2b3d" stroke="#62dfd9" stroke-opacity=".8" stroke-width="2"/>
      <rect x="474" y="91" width="61" height="61" rx="18" fill="#49c9cb" fill-opacity=".16"/>
      <path d="M491 121h27M491 129h27M496 113h17" fill="none" stroke="#8ff3ee" stroke-width="3" stroke-linecap="round"/>
      <text x="474" y="190" fill="#c7fffc" font-size="15" font-weight="700" letter-spacing="2">03 / EXTEND</text>
      <text x="474" y="225" fill="#ffffff" font-size="28" font-weight="800">DLMM</text>
      <text x="474" y="254" fill="#b1c9d0" font-size="16">Optional positions</text>
    </g>
  </g>
  <text x="1485" y="481" text-anchor="end" fill="#9d98bb" font-family="Arial, Helvetica, sans-serif" font-size="13">* Conviction v1 devnet recipe</text>
</svg>
